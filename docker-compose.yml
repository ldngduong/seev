name: seev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./be/.env
    entrypoint: ["/bin/sh", "/usr/local/bin/seev-postgres-entrypoint"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-entrypoint.sh:/usr/local/bin/seev-postgres-entrypoint:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$DATABASE_USER\" -d \"$$DATABASE_NAME\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [seev-network]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [seev-network]

  crawler:
    image: ldngduong/seev-crawler:${SEEV_IMAGE_TAG:-latest}
    build:
      context: ./crawl
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./crawl/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [seev-network]

  backend-init:
    image: ldngduong/seev-backend:${SEEV_IMAGE_TAG:-latest}
    build:
      context: ./be
      dockerfile: Dockerfile
      target: runtime
    restart: "no"
    env_file:
      - ./be/.env
    command: ["node", "dist/database/docker-init.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [seev-network]

  backend-app:
    image: ldngduong/seev-backend:${SEEV_IMAGE_TAG:-latest}
    build:
      context: ./be
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./be/.env
    depends_on:
      backend-init:
        condition: service_completed_successfully
      crawler:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [seev-network]

  backend:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - ./be/.env
    volumes:
      - ./docker/caddy/backend-internal.Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "3000:80"
    depends_on:
      backend-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [seev-network]

  frontend:
    image: ldngduong/seev-frontend:${SEEV_IMAGE_TAG:-latest}
    build:
      context: ./fe
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./fe/.env
    ports:
      - "5555:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [seev-network]

volumes:
  postgres_data:
  redis_data:

networks:
  seev-network:
    driver: bridge
