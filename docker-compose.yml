version: "3.9"

services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    restart: unless-stopped

    ports:
      - "6379:6379"
      - "8001:8001" # RedisInsight

    volumes:
      - redis_data:/data

    environment:
      REDIS_ARGS: "--appendonly yes"

volumes:
  redis_data: